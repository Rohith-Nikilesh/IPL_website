<!DOCTYPE html>
<html>
<head>
    <title> CSK </title>
    <style>
        /* General Page Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        /* Heading Style */
        h1 {
            color: #004ba0; /* CSK Blue */
            text-transform: uppercase;
            border-bottom: 4px solid #ffcb05; /* CSK Yellow */
            padding-bottom: 10px;
        }

        /* List Styling */
        ul {
            list-style: none;
            padding: 0;
            width: 100%;
            max-width: 400px;
        }

        li {
            background: #ffcb05; /* CSK Yellow */
            margin: 10px 0;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            color: #004ba0;
            font-weight: bold;
            transition: transform 0.2s;
        }

        li:hover {
            transform: scale(1.05);
        }

        /* Button Styling */
        button {
            background-color: #004ba0;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0, 75, 160, 0.3);
            transition: background 0.3s;
        }

        button:hover {
            background-color: #003366;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>
<body>

    <h1>CSK Player Squad</h1>

    <ul>
        {% for player in all_players %}
            <li>Name: {{player.name}} | Age: {{player.age}} | ID: {{player.id}}</li>
        {% endfor %}
    </ul>

    <a href="http://127.0.0.1:8000/kkr/">
        <button>Go to KKR Page</button>
    </a>

</body>
</html>
