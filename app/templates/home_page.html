<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home Page</title>
    <style>
        /* General Page Layout */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Takes up full screen height */
            margin: 0;
            color: #333;
        }

        /* Hero Container */
        .container {
            text-align: center;
            background: #ffffff;
            padding: 40px 60px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px); /* Subtle lift on hover */
        }

        /* Heading Styling */
        h1 {
            font-size: 2.5rem;
            margin: 0;
            color: #2c3e50;
            letter-spacing: 1px;
        }

        /* Optional: Subtitle styling */
        p {
            color: #7f8c8d;
            margin-top: 10px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to the Home Page</h1>
        <p>Your journey into the IPL world begins here.</p>
    </div>

</body>
</html>
