<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KKR - Official Fan Page</title>
    <style>
        /* General Page Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2e0854; /* Deep KKR Purple */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        /* Header Styling */
        h1 {
            font-size: 3rem;
            color: #b38b2d; /* KKR Gold */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        /* Button Styling */
        .btn-rcb {
            background-color: #d1ab3e; /* Gold Button */
            color: #2e0854; /* Purple Text */
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.3s, background-color 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        /* Hover Effects */
        .btn-rcb:hover {
            background-color: #ffffff;
            transform: scale(1.1);
            box-shadow: 0px 0px 15px rgba(179, 139, 45, 0.8);
        }

        /* Link cleanup */
        a {
            text-decoration: none;
        }
    </style>
</head>
<body>

    <h1>Welcome to KKR Page</h1>
    
    <!-- Link wrapping the button correctly -->
    <a href="http://127.0.0.1:8000/rcb/">
        <button class="btn-rcb">Switch to RCB</button>
    </a>

</body>
</html>
